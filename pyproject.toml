[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skepstack"
version = "1.0.0"
description = "SkepStack - an offline, append-only ledger of beehive inspections with CSV import/export"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]

[project.scripts]
skepstack = "skepstack:main"

[tool.setuptools]
py-modules = ["skepstack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
